# Default local profile: in-memory/file H2 so the app starts without MySQL.
spring:
  datasource:
    url: jdbc:h2:file:./data/smart-booking;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
