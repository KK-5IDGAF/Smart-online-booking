services:
  mysql:
    image: mysql:8.0
    container_name: sob-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_booking
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sob-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smart_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: SmartOnlineBookingJwtSecretKeyThatIsAtLeast256BitsLongForHS256
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: sob-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
